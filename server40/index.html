<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>I Tech — Admin</title>
<link rel="icon" href="icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1D4D;--navy-soft:#2B4A80;--red:#E11D2E;--blue:#1F55B8;
  --ink:#16202F;--ink-soft:#5A6577;--page:#EEF1F6;--line:#D8DEE8;
  --green:#12894B;--amber:#B26A00;
  --r:14px;--ease:cubic-bezier(.22,.7,.28,1);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--page);color:var(--ink);line-height:1.55}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #7FA8FF;outline-offset:2px;border-radius:6px}
.wrap{width:min(1240px,100% - 2rem);margin-inline:auto}

.topbar{
  position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.85rem clamp(.9rem,3vw,1.6rem);box-shadow:0 6px 20px rgba(8,22,55,.25);
}
.brand{display:flex;align-items:center;gap:.7rem}
.brand img{height:32px;width:auto}
.brand b{font-family:'Barlow Condensed',sans-serif;letter-spacing:.06em;font-size:1.12rem;font-weight:600}
.brand small{display:block;font-size:.7rem;color:rgba(255,255,255,.6);letter-spacing:.1em;margin-top:-2px}
.top-actions{display:flex;gap:.5rem;align-items:center}
.iconbtn{
  width:40px;height:40px;border-radius:10px;display:grid;place-items:center;
  background:rgba(255,255,255,.1);transition:background .2s var(--ease),transform .2s var(--ease);
}
.iconbtn:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}
.live{display:flex;align-items:center;gap:.45rem;font-size:.78rem;color:rgba(255,255,255,.8);padding-right:.4rem}
.dot{width:8px;height:8px;border-radius:50%;background:#37D67A;box-shadow:0 0 0 0 rgba(55,214,122,.6);animation:pulse 2s infinite}
.dot.off{background:#FF6B6B;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(55,214,122,0)}100%{box-shadow:0 0 0 0 rgba(55,214,122,0)}}

main{padding:1.6rem 0 3rem}
.stats{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:1.3rem}
.stat{background:#fff;border-radius:var(--r);padding:1.05rem 1.15rem;box-shadow:0 2px 10px rgba(11,29,77,.07);border-left:3px solid var(--navy)}
.stat.paid{border-left-color:var(--green)}
.stat.pend{border-left-color:var(--amber)}
.stat.cash{border-left-color:var(--red)}
.stat span{display:block;font-size:.76rem;color:var(--ink-soft);font-weight:600}
.stat b{display:block;font-size:1.75rem;letter-spacing:-.02em;margin-top:.15rem}

.toolbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1rem}
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);color:#9AA4B4}
.search input{
  width:100%;font:inherit;font-size:.94rem;padding:.7rem .9rem .7rem 2.4rem;
  border:1px solid var(--line);border-radius:11px;background:#fff;
  transition:border-color .2s,box-shadow .2s;
}
.search input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,85,184,.14)}
.chips{display:flex;gap:.4rem;background:#fff;border:1px solid var(--line);border-radius:11px;padding:.25rem}
.chip{padding:.45rem .9rem;border-radius:9px;font-size:.86rem;font-weight:600;color:var(--ink-soft);transition:background .2s,color .2s}
.chip.on{background:var(--navy);color:#fff}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.68rem 1.1rem;border-radius:11px;font-weight:600;font-size:.9rem;transition:transform .2s var(--ease),background .2s}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:#0a1940;transform:translateY(-1px)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}
.btn-ghost:hover{background:#F4F7FC}
.btn-danger{background:#FFF1F2;color:#9E1420;border:1px solid #F7C9CE}
.btn-danger:hover{background:#FFE4E7}

.tablecard{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(11,29,77,.08);overflow:hidden}
.scroller{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th{
  text-align:left;font-size:.75rem;font-weight:700;color:var(--ink-soft);
  padding:.85rem 1rem;background:#F6F8FC;border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:.85rem 1rem;border-bottom:1px solid #EEF1F6;font-size:.9rem;vertical-align:middle}
tbody tr{transition:background .16s var(--ease);cursor:pointer}
tbody tr:hover{background:#F7FAFF}
.who{display:flex;align-items:center;gap:.7rem}
.av{width:34px;height:34px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:.78rem;font-weight:700;flex:none}
.who b{display:block;font-weight:600}
.who small{color:var(--ink-soft);font-size:.78rem}
.tag{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .6rem;border-radius:999px;font-size:.76rem;font-weight:700}
.tag.paid{background:#E8F7EE;color:var(--green)}
.tag.pending{background:#FFF4E5;color:var(--amber)}
.tag i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.empty,.loading{padding:3.2rem 1rem;text-align:center;color:var(--ink-soft)}
.empty svg{margin:0 auto .8rem;color:#C3CBD8}
.empty h3{margin:0 0 .3rem;color:var(--ink);font-size:1.05rem}
.bigspin{width:26px;height:26px;border:3px solid #DCE3EE;border-top-color:var(--navy);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto .8rem}
@keyframes sp{to{transform:rotate(360deg)}}
.rowfade{animation:rf .35s var(--ease)}
@keyframes rf{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;visibility:hidden;transition:opacity .28s var(--ease),visibility .28s}
.modal.open{opacity:1;visibility:visible}
.modal-bg{position:absolute;inset:0;background:rgba(6,16,40,.6);backdrop-filter:blur(4px)}
.sheet{position:relative;background:#fff;border-radius:18px;width:min(560px,100%);max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(8,22,55,.32);transform:translateY(20px) scale(.985);opacity:0;transition:transform .36s var(--ease),opacity .3s}
.modal.open .sheet{transform:none;opacity:1}
.sheet-head{position:sticky;top:0;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:1rem 1.2rem}
.sheet-head h3{margin:0;font-size:1.05rem}
.sheet-head button{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;transition:background .2s}
.sheet-head button:hover{background:rgba(255,255,255,.16)}
.sheet-body{padding:1.2rem}
.dl{display:grid;gap:0}
.dl div{display:flex;justify-content:space-between;gap:1rem;padding:.6rem 0;border-bottom:1px solid #EEF1F6;font-size:.92rem}
.dl span{color:var(--ink-soft)}
.dl b{text-align:right;font-weight:600;word-break:break-word}
.rowbtns{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.1rem}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,120%);z-index:90;background:var(--navy);color:#fff;border-radius:999px;padding:.72rem 1.25rem;font-size:.88rem;box-shadow:0 18px 40px rgba(8,22,55,.3);transition:transform .4s var(--ease)}
.toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="icon.png" alt="" />
    <div><b>THE I TECH</b><small>ADMIN</small></div>
  </div>
  <div class="top-actions">
    <span class="live"><i class="dot" id="liveDot"></i><span id="liveText">Live</span></span>
    <button class="iconbtn" id="btnExport" title="Export CSV" aria-label="Export CSV">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 19h16"/></svg>
    </button>
    <a class="iconbtn" href="index.html" title="Open site" aria-label="Open site">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>
    </a>
  </div>
</header>

<main class="wrap">
  <section class="stats">
    <div class="stat"><span>Total applications</span><b id="sTotal">0</b></div>
    <div class="stat paid"><span>Paid &amp; joined</span><b id="sPaid">0</b></div>
    <div class="stat pend"><span>Awaiting payment</span><b id="sPending">0</b></div>
    <div class="stat cash"><span>Total collected</span><b id="sCash">₦0</b></div>
  </section>

  <div class="toolbar">
    <div class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Search name, email, phone, state or reference" />
    </div>
    <div class="chips">
      <button class="chip on" data-filter="all">All</button>
      <button class="chip" data-filter="paid">Paid</button>
      <button class="chip" data-filter="pending">Pending</button>
    </div>
    <button class="btn btn-ghost" id="btnRefresh">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      Refresh
    </button>
  </div>

  <div class="tablecard">
    <div class="scroller">
      <table>
        <thead>
          <tr>
            <th>Applicant</th><th>Phone</th><th>Age</th><th>Gender</th>
            <th>State</th><th>Amount</th><th>Status</th><th>Applied</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="loading" id="loading"><div class="bigspin"></div>Loading registrations…</div>
    <div class="empty" id="empty" style="display:none">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 10h8M8 14h5"/></svg>
      <h3>No registrations yet</h3>
      <p>When someone applies on the site, their record shows up here straight away.</p>
    </div>
  </div>
</main>

<div class="modal" id="mDetail" role="dialog" aria-modal="true">
  <div class="modal-bg" data-close></div>
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="dTitle">Registration</h3>
      <button data-close aria-label="Close"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="sheet-body">
      <div class="dl" id="dBody"></div>
      <div class="rowbtns">
        <a class="btn btn-navy" id="dCall">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h3l2 5-2.2 1.4a12 12 0 0 0 5.8 5.8L15 14l5 2v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 3 6.2 2 2 0 0 1 5 4z"/></svg>
          Call
        </a>
        <a class="btn btn-ghost" id="dMail">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          Email
        </a>
        <button class="btn btn-ghost" id="dMark">Mark as paid</button>
        <button class="btn btn-danger" id="dDelete">Delete</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBDciEH9adAe22IEuxP2a3P9SDlTVm9x4c",
  authDomain: "projecttechnology-946f6.firebaseapp.com",
  projectId: "projecttechnology-946f6",
  storageBucket: "projecttechnology-946f6.firebasestorage.app",
  messagingSenderId: "68626958170",
  appId: "1:68626958170:web:cf3a43b8ccf956c6a29563",
  measurementId: "G-HEJXCV1ZFM"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const naira = n => '₦' + Number(n||0).toLocaleString('en-NG');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let DATA = [], filter = 'all', query = '', current = null, unsub = null;

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2800); }
function initials(r){ return ((r.firstName||'?')[0] + (r.lastName||'')[0]||'').toUpperCase(); }
function when(ts){
  if(!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) + ' · ' +
         d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

function listen(){
  $('#loading').style.display = 'block';
  if(unsub) unsub();
  unsub = db.collection('registrations').orderBy('createdAt','desc')
    .onSnapshot(snap=>{
      DATA = snap.docs.map(d=>({id:d.id, ...d.data()}));
      $('#loading').style.display = 'none';
      $('#liveDot').classList.remove('off'); $('#liveText').textContent = 'Live';
      render();
    }, err=>{
      console.error(err);
      $('#loading').style.display = 'none';
      $('#liveDot').classList.add('off'); $('#liveText').textContent = 'Offline';
      toast('Could not reach the database. Check your Firestore rules.');
    });
}

function matches(r){
  if(filter !== 'all' && (r.status||'pending') !== filter) return false;
  if(!query) return true;
  const hay = [r.firstName,r.middleName,r.lastName,r.email,r.phone,r.state,r.address,r.pageName,r.paymentRef].join(' ').toLowerCase();
  return hay.includes(query);
}

function render(){
  const list = DATA.filter(matches);

  const paid = DATA.filter(r=>r.status==='paid');
  $('#sTotal').textContent   = DATA.length;
  $('#sPaid').textContent    = paid.length;
  $('#sPending').textContent = DATA.length - paid.length;
  $('#sCash').textContent    = naira(paid.reduce((s,r)=>s+Number(r.amount||0),0));

  $('#empty').style.display = (list.length===0 && $('#loading').style.display==='none') ? 'block' : 'none';

  $('#rows').innerHTML = list.map(r=>{
    const st = r.status === 'paid' ? 'paid' : 'pending';
    return '<tr class="rowfade" data-id="'+r.id+'">'+
      '<td><div class="who"><div class="av">'+esc(initials(r))+'</div><div>'+
        '<b>'+esc([r.firstName,r.middleName,r.lastName].filter(Boolean).join(' '))+'</b>'+
        '<small>'+esc(r.email||'')+'</small></div></div></td>'+
      '<td>'+esc(r.phone||'—')+'</td>'+
      '<td>'+esc(r.age||'—')+'</td>'+
      '<td>'+esc(r.gender||'—')+'</td>'+
      '<td>'+esc(r.state||'—')+'</td>'+
      '<td>'+naira(r.amount)+'</td>'+
      '<td><span class="tag '+st+'"><i></i>'+(st==='paid'?'Paid':'Pending')+'</span></td>'+
      '<td>'+esc(when(r.createdAt))+'</td>'+
    '</tr>';
  }).join('');

  $$('#rows tr').forEach(tr=> tr.addEventListener('click', ()=> openDetail(tr.dataset.id)));
}

function openDetail(id){
  const r = DATA.find(x=>x.id===id);
  if(!r) return;
  current = r;
  $('#dTitle').textContent = [r.firstName,r.lastName].filter(Boolean).join(' ') || 'Registration';
  const rows = [
    ['First name',r.firstName],['Middle name',r.middleName],['Last name',r.lastName],
    ['Email',r.email],['Phone',r.phone],['Age',r.age],['Address',r.address],
    ['State',r.state],['Gender',r.gender],['Next of kin',r.nextOfKin],['Page name',r.pageName],
    ['Amount',naira(r.amount)],['Status',(r.status||'pending')==='paid'?'Paid':'Awaiting payment'],
    ['Payment reference',r.paymentRef],['Applied',when(r.createdAt)],['Paid',when(r.paidAt)]
  ];
  $('#dBody').innerHTML = rows.map(([k,v])=>'<div><span>'+k+'</span><b>'+esc(v||'—')+'</b></div>').join('');
  $('#dCall').href = r.phone ? 'tel:'+r.phone : '#';
  $('#dMail').href = r.email ? 'mailto:'+r.email : '#';
  $('#dMark').style.display = (r.status==='paid') ? 'none' : '';
  $('#mDetail').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeDetail(){ $('#mDetail').classList.remove('open'); document.body.style.overflow=''; }
$('#mDetail').addEventListener('click', e=>{ if(e.target.closest('[data-close]')) closeDetail(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDetail(); });

$('#dMark').addEventListener('click', async ()=>{
  if(!current) return;
  try{
    await db.collection('registrations').doc(current.id).update({
      status:'paid', paidAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast('Marked as paid'); closeDetail();
  }catch(e){ console.error(e); toast('Update failed'); }
});

$('#dDelete').addEventListener('click', async ()=>{
  if(!current) return;
  if(!confirm('Delete this registration permanently?')) return;
  try{ await db.collection('registrations').doc(current.id).delete(); toast('Registration deleted'); closeDetail(); }
  catch(e){ console.error(e); toast('Delete failed'); }
});

$('#q').addEventListener('input', e=>{ query = e.target.value.trim().toLowerCase(); render(); });
$$('.chip').forEach(c=> c.addEventListener('click', ()=>{
  $$('.chip').forEach(x=>x.classList.remove('on')); c.classList.add('on');
  filter = c.dataset.filter; render();
}));
$('#btnRefresh').addEventListener('click', ()=>{ listen(); toast('Refreshed'); });

$('#btnExport').addEventListener('click', ()=>{
  if(!DATA.length) return toast('Nothing to export yet');
  const head = ['First name','Middle name','Last name','Email','Phone','Age','Address','State','Gender','Next of kin','Page name','Amount','Status','Reference','Applied'];
  const q = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
  const body = DATA.map(r=>[r.firstName,r.middleName,r.lastName,r.email,r.phone,r.age,r.address,r.state,r.gender,r.nextOfKin,r.pageName,r.amount,r.status,r.paymentRef,when(r.createdAt)].map(q).join(','));
  const blob = new Blob([[head.map(q).join(',')].concat(body).join('\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'itech-registrations-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click(); URL.revokeObjectURL(a.href);
  toast('CSV exported');
});

listen();
</script>
</body>
</html>
