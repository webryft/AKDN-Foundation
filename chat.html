<style>
:root{
  --green:#0a8f5a;--green2:#087a4d;--green3:#065e3a;
  --bg:#f2f2f2;--white:#fff;--text:#111;--text2:#666;
  --bubble-out:#0a8f5a;--bubble-in:#fff;
  --header-h:60px;--input-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:var(--bg)}

/* HEADER */
.ch-header{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);
  background:var(--green3);display:flex;align-items:center;gap:12px;
  padding:0 14px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.ch-back{background:none;border:none;cursor:pointer;color:#fff;display:flex;align-items:center;padding:4px 6px;border-radius:8px;transition:background .15s}
.ch-back:hover{background:rgba(255,255,255,.15)}
.ch-back svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ch-avatar{position:relative;flex-shrink:0}
.ch-avatar img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.4);display:block}
.online-dot{position:absolute;bottom:1px;right:1px;width:11px;height:11px;background:#22c55e;border-radius:50%;border:2px solid var(--green3)}
.ch-info{flex:1;min-width:0}
.ch-name{font-size:15px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-status{font-size:11px;color:#a7f3d0;margin-top:1px}
.ch-actions{display:flex;gap:4px}
.ch-actions button{background:none;border:none;cursor:pointer;color:#fff;padding:6px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.ch-actions button:hover{background:rgba(255,255,255,.15)}
.ch-actions button svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* MESSAGES AREA */
.ch-msgs{
  position:fixed;top:var(--header-h);left:0;right:0;
  bottom:var(--input-h);overflow-y:auto;padding:14px 12px 8px;
  display:flex;flex-direction:column;gap:4px;
}
.ch-msgs::-webkit-scrollbar{width:3px}
.ch-msgs::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:2px}

/* DAY SEPARATOR */
.day-sep{text-align:center;margin:10px 0 4px}
.day-sep span{background:rgba(0,0,0,.12);color:#555;font-size:11px;padding:3px 10px;border-radius:20px}

/* BUBBLE */
.msg-row{display:flex;align-items:flex-end;gap:6px;max-width:100%}
.msg-row.out{flex-direction:row-reverse}
.msg-row.in .bubble-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0}
.msg-row.out .bubble-avatar{display:none}
.bubble-wrap{max-width:72%;position:relative}
.bubble{
  padding:9px 13px;border-radius:18px;font-size:14px;line-height:1.45;
  word-break:break-word;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.1);
}
.msg-row.out .bubble{background:var(--bubble-out);color:#fff;border-bottom-right-radius:4px}
.msg-row.in  .bubble{background:var(--bubble-in);color:var(--text);border-bottom-left-radius:4px}
.bubble-time{font-size:10px;margin-top:3px;opacity:.65;text-align:right}
.msg-row.out .bubble-time{color:#fff}
.msg-row.in  .bubble-time{color:var(--text2)}
.bubble-status{font-size:10px;color:rgba(255,255,255,.7);margin-left:4px}

/* REACTIONS BAR */
.reaction-bar{
  display:none;position:absolute;bottom:calc(100% + 4px);
  background:#fff;border-radius:24px;padding:5px 8px;
  box-shadow:0 4px 16px rgba(0,0,0,.18);gap:4px;
  flex-wrap:nowrap;z-index:200;white-space:nowrap;
}
.reaction-bar.show{display:flex}
.msg-row.out .reaction-bar{right:0}
.msg-row.in  .reaction-bar{left:0}
.react-btn{background:none;border:none;cursor:pointer;font-size:18px;padding:2px 4px;border-radius:8px;transition:transform .15s}
.react-btn:hover{transform:scale(1.25)}
.del-btn{background:none;border:none;cursor:pointer;font-size:11px;color:#e53935;font-weight:600;padding:4px 8px;border-radius:8px;border:1px solid #ffcdd2;margin-left:4px;white-space:nowrap}
.del-btn:hover{background:#ffebee}

/* Reaction display on bubble */
.bubble-reaction{font-size:16px;margin-top:3px;cursor:pointer;display:inline-block}

/* TYPING INDICATOR */
.typing-indicator{display:none;align-items:center;gap:4px;padding:10px 14px;background:#fff;border-radius:18px;border-bottom-left-radius:4px;width:fit-content;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.typing-indicator.show{display:flex}
.typing-dot{width:7px;height:7px;background:#aaa;border-radius:50%;animation:tdot 1.4s infinite both}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,80%,100%{transform:scale(.8);opacity:.5}40%{transform:scale(1.1);opacity:1}}

/* INPUT BAR */
.ch-input-bar{
  position:fixed;bottom:0;left:0;right:0;height:var(--input-h);
  background:#fff;display:flex;align-items:center;gap:8px;
  padding:0 12px;border-top:1px solid #e0e0e0;
}
.ch-input{
  flex:1;border:1.5px solid #e0e0e0;border-radius:24px;padding:10px 16px;
  font-size:14px;font-family:Arial;color:var(--text);outline:none;
  transition:border-color .2s;resize:none;max-height:110px;overflow-y:auto;
  background:#fafafa;line-height:1.4;
}
.ch-input:focus{border-color:var(--green)}
.ch-send-btn{
  width:44px;height:44px;background:var(--green);border:none;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex-shrink:0;transition:background .2s;
}
.ch-send-btn:hover{background:var(--green2)}
.ch-send-btn svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ch-send-btn:disabled{background:#ccc;cursor:not-allowed}

/* EMPTY STATE */
.chat-empty{text-align:center;margin:auto;padding:30px 20px;opacity:.6}
.chat-empty svg{width:52px;height:52px;fill:none;stroke:#999;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-bottom:12px}
.chat-empty p{font-size:14px;color:#888}
</style>

];

const profile = profiles[profileIdx] || profiles[0];
const chatId = `chat_${currentUser.uid}_p${profileIdx}`;

/* ─── INIT HEADER ────────────────────────── */

hAvatar.src = profile.img;
hAvatar.onerror = function(){ this.src='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect fill="%23aaa" width="40" height="40" rx="20"/></svg>'; };

/* ─── EXTERNAL LINK ──────────────────────── */
function openExternal(){
  const links = {
    whatsapp:`https://wa.me/${profile.contact}?text=${encodeURIComponent('Hello from Talk House!')}`,
    telegram:`https://t.me/${profile.contact}`,
    instagram:`https://instagram.com/${profile.contact}`,

    skype:`https://join.skype.com/invite/${profile.contact}`
  };
  const url = links[profile.platform];
  if(!url || profile.contact === '2349079525683'){

    return;
  }
  window.open(url,'_blank');
}

/* ─── ENCRYPTION (E2E — XOR + base64) ──── */
const ENC_KEY = 'TH_' + (currentUser.uid||'x') + '_p' + profileIdx;
function encMsg(text){
  let out='', kl=ENC_KEY.length;
  for(let i=0;i<text.length;i++) out+=String.fromCharCode(text.charCodeAt(i)^ENC_KEY.charCodeAt(i%kl));
  try{ return btoa(unescape(encodeURIComponent(out))); }catch(e){ return btoa(out); }
}
function decMsg(b64){
  try{
    const dec = decodeURIComponent(escape(atob(b64)));
    let out='', kl=ENC_KEY.length;
    for(let i=0;i<dec.length;i++) out+=String.fromCharCode(dec.charCodeAt(i)^ENC_KEY.charCodeAt(i%kl));
    return out;
  }catch(e){ return b64; }
}

/* ─── LOCAL STORAGE MESSAGES ─────────────── */
const LS_KEY = 'th_msgs_' + chatId;

function loadLocalMsgs(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)||'[]'); }
  catch(e){ return []; }
}
function saveLocalMsgs(msgs){
  localStorage.setItem(LS_KEY, JSON.stringify(msgs));
}

let messages = loadLocalMsgs();
let longPressTimer = null;
let activeReactionBar = null;

/* ─── RENDER ─────────────────────────────── */
function renderMessages(){
  const list = document.getElementById('msgList');
  const empty = document.getElementById('chatEmpty');
  const typingRow = document.getElementById('typingRow');

  // remove existing bubbles
  list.querySelectorAll('.msg-row:not(#typingRow), .day-sep').forEach(el=>el.remove());

  if(!messages.length){
    empty.style.display='block';
    return;
  }
  empty.style.display='none';

  let lastDay='';
  const frag = document.createDocumentFragment();

  messages.forEach(msg=>{
    const msgDate = new Date(msg.ts||Date.now());
    const dayStr = msgDate.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'});
    if(dayStr !== lastDay){
      lastDay = dayStr;
      const sep = document.createElement('div');
      sep.className='day-sep';
      sep.innerHTML=`<span>${dayStr}</span>`;
      frag.appendChild(sep);
    }
    frag.appendChild(buildBubble(msg));
  });

  list.insertBefore(frag, typingRow);
  scrollBottom();
}

function buildBubble(msg){
  const isOut = msg.sender === 'user';
  const row = document.createElement('div');
  row.className = 'msg-row ' + (isOut?'out':'in');
  row.dataset.id = msg.id;

  const timeStr = new Date(msg.ts||Date.now()).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const text = msg.deleted ? '<em style="opacity:.5">Message deleted</em>' : esc(msg.text||'');

  if(!isOut){
    const av=document.createElement('img');
    av.className='bubble-avatar';
    av.src=profile.img;
    av.onerror=function(){this.style.display='none'};
    row.appendChild(av);
  }

  const wrap = document.createElement('div');
  wrap.className='bubble-wrap';

  const reactionBar = document.createElement('div');
  reactionBar.className='reaction-bar';
  reactionBar.innerHTML=
    ['❤️','😂','😮','😢','👍','🔥'].map(e=>`<button class="react-btn" onclick="reactMsg('${msg.id}','${e}')">${e}</button>`).join('')+
    `<button class="del-btn" onclick="deleteMsg('${msg.id}',${isOut})">${isOut?'Delete':'Delete'}</button>`;

  const bubble = document.createElement('div');
  bubble.className='bubble';
  bubble.innerHTML=text;

  if(msg.reaction){
    const r = document.createElement('div');
    r.className='bubble-reaction';
    r.textContent=msg.reaction;
    bubble.appendChild(r);
  }

  const timeEl = document.createElement('div');
  timeEl.className='bubble-time';
  timeEl.innerHTML=timeStr+(isOut?'<span class="bubble-status">✓✓</span>':'');

  wrap.appendChild(reactionBar);
  wrap.appendChild(bubble);
  wrap.appendChild(timeEl);
  row.appendChild(wrap);

  // Long press to show reaction bar
  function showBar(){
    if(activeReactionBar && activeReactionBar!==reactionBar) activeReactionBar.classList.remove('show');
    reactionBar.classList.toggle('show');
    activeReactionBar=reactionBar;
  }
  bubble.addEventListener('touchstart',()=>{ longPressTimer=setTimeout(showBar,500); },{passive:true});
  bubble.addEventListener('touchend',()=>{ clearTimeout(longPressTimer); },{passive:true});
  bubble.addEventListener('touchmove',()=>{ clearTimeout(longPressTimer); },{passive:true});
  bubble.addEventListener('contextmenu',e=>{ e.preventDefault(); showBar(); });

  return row;
}

function scrollBottom(){
  const list = document.getElementById('msgList');
  list.scrollTop = list.scrollHeight;
}

/* ─── SEND MESSAGE ───────────────────────── */
const inputEl = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

inputEl.addEventListener('input',function(){
  sendBtn.disabled = !this.value.trim();
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,110)+'px';
});
inputEl.addEventListener('keydown',function(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});

function sendMessage(){
  const text = inputEl.value.trim();
  if(!text) return;
  const msg = {
    id: 'msg_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    sender:'user',
    text,
    ts: Date.now(),
    deleted:false,
    reaction:null,
    read:false
  };
  messages.push(msg);
  saveLocalMsgs(messages);
  renderMessages();
  inputEl.value='';
  sendBtn.disabled=true;
  inputEl.style.height='auto';

  // Send to Firebase (for sectoradmin to see) — store encrypted
  if(window._FB){
    const fbMsg = {
      chatId, profileIdx, profileName:profile.name,
      userId:currentUser.uid, userName:currentUser.fname+' '+currentUser.lname,
      userPhone:currentUser.phone,
      msgId:msg.id, text:encMsg(text),
      sender:'user', ts:msg.ts, deleted:false,
      reaction:null
    };
    window._fbAddDoc(
      window._fbCollection(window._db, 'chats', chatId, 'messages'),
      fbMsg
    ).catch(()=>{});
    // Update chat metadata
    window._fbSetDoc(window._fbDoc(window._db,'chatMeta',chatId),{
      chatId, profileIdx, profileName:profile.name,
      userId:currentUser.uid, userName:currentUser.fname+' '+currentUser.lname,
      userPhone:currentUser.phone,
      lastMsg:encMsg(text), lastTs:msg.ts,
      unreadAdmin:(window._unreadAdmin||0)+1
    },{merge:true}).catch(()=>{});
  }

  // Simulate typing response after 1.5s
  simulateTyping();
}

/* ─── SIMULATE TYPING (until sectoradmin replies) */
let typingTimeout;
function simulateTyping(){
  const typingRow = document.getElementById('typingRow');
  const ind = document.getElementById('typingIndicator');
  typingRow.style.display='flex';
  ind.classList.add('show');
  scrollBottom();
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(()=>{
    typingRow.style.display='none';
    ind.classList.remove('show');
  }, 4000);
}

/* ─── LISTEN FOR REPLIES FROM SECTORADMIN ── */
function listenForReplies(){
  if(!window._FB) return;
  const q = window._fbQuery(
    window._fbCollection(window._db,'chats',chatId,'messages'),
    window._fbOrderBy('ts','asc')
  );
  window._fbOnSnapshot(q, snap=>{
    snap.docChanges().forEach(change=>{
      if(change.type==='added'){
        const d=change.doc.data();
        if(d.sender==='profile'){
          // Check if already in local storage
          const exists = messages.find(m=>m.id===d.msgId);
          if(!exists){
            const newMsg={
              id:d.msgId||change.doc.id,
              sender:'profile',
              text:decMsg(d.text||''),
              ts:d.ts||Date.now(),
              deleted:d.deleted||false,
              reaction:d.reaction||null,
              read:true
            };
            messages.push(newMsg);
            // Sort by ts
            messages.sort((a,b)=>a.ts-b.ts);
            saveLocalMsgs(messages);
            // Hide typing
            document.getElementById('typingRow').style.display='none';
            document.getElementById('typingIndicator').classList.remove('show');
            renderMessages();
          }
        }
        // Handle deletes/reactions from admin
        if(d.sender==='admin_action'){
          if(d.action==='delete'){
            const m=messages.find(x=>x.id===d.targetId);
            if(m){ m.deleted=true; saveLocalMsgs(messages); renderMessages(); }
          }
          if(d.action==='react'){
            const m=messages.find(x=>x.id===d.targetId);
            if(m){ m.reaction=d.reaction; saveLocalMsgs(messages); renderMessages(); }
          }
        }
      }
    });
  });
}

/* ─── REACT TO MESSAGE ───────────────────── */
function reactMsg(id, emoji){
  const m=messages.find(x=>x.id===id);
  if(!m) return;
  m.reaction = m.reaction===emoji ? null : emoji;
  saveLocalMsgs(messages);
  renderMessages();
  if(activeReactionBar){ activeReactionBar.classList.remove('show'); activeReactionBar=null; }
  // Sync to firebase
  if(window._FB){
    window._fbAddDoc(window._fbCollection(window._db,'chats',chatId,'messages'),{
      msgId:'admin_action_'+Date.now(), sender:'admin_action',
      action:'react', targetId:id, reaction:m.reaction, ts:Date.now(), chatId
    }).catch(()=>{});
  }
}

/* ─── DELETE MESSAGE ─────────────────────── */
function deleteMsg(id, isOwn){
  if(!confirm(isOwn?'Delete this message for everyone?':'Delete this message?')) return;
  const m=messages.find(x=>x.id===id);
  if(!m) return;
  m.deleted=true;
  saveLocalMsgs(messages);
  renderMessages();
  if(activeReactionBar){ activeReactionBar.classList.remove('show'); activeReactionBar=null; }
  if(window._FB){
    window._fbAddDoc(window._fbCollection(window._db,'chats',chatId,'messages'),{
      msgId:'admin_action_del_'+Date.now(), sender:'admin_action',
      action:'delete', targetId:id, ts:Date.now(), chatId
    }).catch(()=>{});
  }
}

/* ─── CLOSE REACTION BAR ON OUTSIDE CLICK ─ */
document.addEventListener('click',()=>{
  if(activeReactionBar){ activeReactionBar.classList.remove('show'); activeReactionBar=null; }
});

/* ─── UTILS ──────────────────────────────── */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ─── INIT ───────────────────────────────── */
renderMessages();
if(window._FB) listenForReplies();
else document.addEventListener('firebase-ready', listenForReplies);
</script>
